<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>비밀번호 재설정 — VI One</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:#1C1C1E;background:#F8FAFE;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:18px;padding:32px 26px;max-width:400px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.brand{font-size:24px;font-weight:800;margin-bottom:4px}.brand .dot{color:#50AAEE}
h1{font-size:19px;font-weight:700;margin:14px 0 6px}
p{font-size:14px;color:#3C3C43;line-height:1.6;margin-bottom:16px}
label{display:block;font-size:12.5px;font-weight:700;color:#8E8E93;margin:12px 0 6px}
input{width:100%;padding:13px 14px;border:1px solid rgba(0,0,0,.14);border-radius:11px;font-size:15px;outline:none}
input:focus{border-color:#50AAEE}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#50AAEE;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:12px;font-size:13.5px;line-height:1.5}
.err{color:#E5484D}.ok{color:#1A9E55}
.hidden{display:none}
.fine{margin-top:20px;font-size:12px;color:#8E8E93}
</style>
</head>
<body>
<div class="card">
  <div class="brand">VI One<span class="dot">.</span></div>

  <div id="loading">
    <h1>확인 중...</h1>
    <p>재설정 링크를 확인하고 있습니다. 잠시만 기다려 주세요.</p>
  </div>

  <div id="form" class="hidden">
    <h1>새 비밀번호 설정</h1>
    <p>새로 사용할 비밀번호를 입력해 주세요. (6자 이상)</p>
    <label>새 비밀번호</label>
    <input id="pw1" type="password" autocomplete="new-password" placeholder="••••••••">
    <label>새 비밀번호 확인</label>
    <input id="pw2" type="password" autocomplete="new-password" placeholder="••••••••">
    <button id="submit">비밀번호 변경</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="done" class="hidden">
    <h1>변경 완료 ✓</h1>
    <p>비밀번호가 변경되었습니다.<br><b>VI One 앱으로 돌아가 새 비밀번호로 로그인해 주세요.</b></p>
  </div>

  <div id="invalid" class="hidden">
    <h1>링크가 유효하지 않아요</h1>
    <p>재설정 링크가 만료되었거나 이미 사용되었습니다.<br>앱의 로그인 화면에서 <b>"비밀번호를 잊으셨나요?"</b>를 다시 눌러 새 링크를 받아 주세요.</p>
  </div>

  <p class="fine">문의: hellosangwoo@gmail.com</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(
  "https://awnumaschuictuclucmt.supabase.co",
  "sb_publishable_JPdIb72UcP7lZfmOtFXflg_GFMh_0tT"
);
const $ = id => document.getElementById(id);
function show(id){ ["loading","form","done","invalid"].forEach(x=>$(x).classList.toggle("hidden",x!==id)); }

let ready = false;
// recovery 링크로 진입하면 supabase-js가 URL의 토큰으로 세션을 만든다
sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" || (session && !ready)) { ready = true; show("form"); }
});
// 폴백: 2.5초 안에 세션이 안 잡히면 무효 링크로 안내
setTimeout(async () => {
  if (ready) return;
  const { data } = await sb.auth.getSession();
  if (data && data.session) { ready = true; show("form"); }
  else show("invalid");
}, 2500);

$("submit").onclick = async () => {
  const p1 = $("pw1").value, p2 = $("pw2").value, m = $("msg");
  m.className = "msg";
  if (p1.length < 6) { m.className = "msg err"; m.textContent = "비밀번호는 6자 이상이어야 합니다."; return; }
  if (p1 !== p2) { m.className = "msg err"; m.textContent = "두 비밀번호가 일치하지 않습니다."; return; }
  $("submit").disabled = true; m.textContent = "변경 중...";
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { $("submit").disabled = false; m.className = "msg err"; m.textContent = "변경 실패: " + error.message; return; }
  try { await sb.auth.signOut(); } catch (e) {}
  show("done");
};
</script>
</body>
</html>
